[project]
name = "tavily-search-mcp"
version = "0.1.0"
description = "A Streamable HTTP MCP server exposing Tavily web search and fetch tools."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1,<2.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "tavily-python>=0.7.0,<1.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0"
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
